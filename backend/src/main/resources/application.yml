server:
  port: 8080

spring:
  application:
    name: oliveconnect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://oliveconnect:change-me@localhost:27017/oliveconnect?authSource=admin}
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

oliveconnect:
  jwt:
    secret: ${JWT_SECRET:PtvfsATs53kuMxWNH4kZ3jPyojHoNSs1rumISO5QWYoGamfC/JRMpnvf+Naq1ofp}
    expiration-seconds: 7200
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  import:
    inbox-dir: ${OLIVECONNECT_IMPORT_INBOX:../sample-data/inbox}
    processed-dir: ${OLIVECONNECT_IMPORT_PROCESSED:../sample-data/processed}
    max-bytes: 5242880
    poll-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
