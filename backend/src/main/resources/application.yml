server:
  port: 8080

spring:
  application:
    name: oliveconnect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://oliveconnect:change-me@localhost:27017/oliveconnect?authSource=admin}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET:PtvfsATs53kuMxWNH4kZ3jPyojHoNSs1rumISO5QWYoGamfC/JRMpnvf+Naq1ofp}
    expiration-seconds: 7200
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
